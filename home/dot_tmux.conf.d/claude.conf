# ═══════════════════════════════════════════════════════════════
#  Claude Code workflow additions — sourced from ~/.tmux.conf via
#  `if-shell [ -f ~/.tmux.conf.d/claude.conf ]`, AFTER the theme's
#  generated theme.conf, so the directives here are the final word.
# ═══════════════════════════════════════════════════════════════
#
#  Makes multi-session Claude work glanceable, in the slim/airy aesthetic of
#  the themed bar (no powerline capsules). Two facts only:
#
#    • per-window glyph   ● working   ◉ idle / may-need-you   (none if no Claude)
#      colored by context pressure: green <60% · yellow 60–85% · red ≥85%
#      (dim if unknown); % appended only once it matters (≥60%).
#    • status-right aggregate   ◉<waiting> ●<active> ⤒<hottest ctx>%
#
#  HOW (daemon-driven — no #() heavy work in the render loop): a single
#  ~/.local/bin/tmux-claude-glanced daemon (spawned by the hooks at the bottom)
#  reads live Claude processes (precise pane→session via each proc's /proc
#  environ), derives context-% from transcripts, and PUSHES pre-colored options:
#  per-window #{@claude_glyph} (+ raw @claude_act/@claude_ctx/@claude_since for
#  the `cc` helpers) and the global #{@claude_glance} aggregate. The bar formats
#  below just interpolate those options — ZERO shell per redraw — so the heavy
#  scan can never run inside tmux's status loop (the old #() poll piled up and
#  spun the fans). Colors come from the @t_* palette at push time, so `theme
#  set` recolors within one tick.

# Default context-window size for the ctx-% gauge. tmux hooks/daemons run with
# the server env, so this option (not a shell export) is how the daemon learns
# the real limit. This machine runs Opus 4.8 1M by default; set to 200000 if you
# mostly run standard context (the daemon falls back to a heuristic when 0).
set -g @claude_ctx_limit 1000000

# Consolidated claude-hud usage in the status-right aggregate. When on (default),
# tmux-claude-glanced appends `· $<summed-cost> · 5h <max%> · 7d <max%> · +/-lines`
# to @claude_glance, sourced from per-session snapshots written by the statusLine
# wrapper (~/.local/bin/claude-hud-usage-wrap). Set to 0 to render only the
# session/context glance. (cost + rate-limits live ONLY in the statusLine stdin,
# never the transcript, so the wrapper is the sole channel for this data.)
set -g @claude_usage 1

# ── Per-window Claude glyph (pushed into @claude_glyph; space only when set) ─
setw -g window-status-format \
  "#[fg=#{@t_dim}] #I:#W#{?#{@claude_glyph}, #{@claude_glyph},}#{?window_zoomed_flag, ⊕,}#{?window_last_flag, ‹,} "
setw -g window-status-current-format \
  "#[fg=#{@t_cyan},bold] #I:#W#{?#{@claude_glyph}, #{@claude_glyph},}#{?window_zoomed_flag, ⊕,} "

# ── Slim status-right: Claude aggregate · git · clock ───────────────────────
# #{@claude_glance} is pure option interpolation (pushed by the daemon) — no
# shell spawned per redraw. git-branch stays a #() (cheap, capped by timeout).
set -g status-right \
  "#{@claude_glance} #[fg=#{@t_dim}]#(timeout -k 1 3 ~/.local/bin/tmux-git-branch '#{pane_current_path}') #[fg=#{@t_pink}]%H:%M "
set -g status-right-length 120

# ── Daemon lifecycle: one tmux-claude-glanced per server (flock singleton) ───
# --ensure no-ops if a daemon already holds the lock; the daemon exits on its own
# when the server dies. Spawned on new session, on client attach, and at config
# load so a reload re-ensures it. Nothing else uses these hooks (checked), so a
# plain replace (-g) keeps them idempotent across reloads.
set-hook -g session-created 'run-shell -b "~/.local/bin/tmux-claude-glanced --ensure"'
set-hook -g client-attached 'run-shell -b "~/.local/bin/tmux-claude-glanced --ensure"'
run-shell -b "~/.local/bin/tmux-claude-glanced --ensure"
