# ═══════════════════════════════════════════════════════════════
#  Claude Code workflow additions — sourced from ~/.tmux.conf via
#  `if-shell [ -f ~/.tmux.conf.d/claude.conf ]`. Keep additive.
# ═══════════════════════════════════════════════════════════════
#
# Custom status-right: claude activity indicator + path + clock + date.
# Colors reference the theme palette user-options (@t_*) emitted by the
# generated ~/.config/tmux/theme.conf, so this follows `theme set <name>`
# live (re-expanded each status redraw) instead of hardcoding a palette.
#
# NOTE: claude-tmux-layout is bound to `o` in the main config (the prior
# local `bind C` override was dropped — it shadowed C=new-window and
# duplicated `o`). The absolute path to claude-tmux-statusline is used
# because tmux runs #() commands without ~/.local/bin on PATH.
set -g status-right "#[fg=#{@t_yellow},bg=#{@t_void}] #(~/.local/bin/claude-tmux-statusline 2>/dev/null) #[fg=#{@t_panel},bg=#{@t_void}]#[fg=#{@t_cyan},bg=#{@t_panel}] #{pane_current_path} #[fg=#{@t_pink},bg=#{@t_panel}]#[fg=#{@t_fg_on_pink},bg=#{@t_pink},bold] %H:%M #[fg=#{@t_yellow},bg=#{@t_pink}]#[fg=#{@t_fg_on_yellow},bg=#{@t_yellow},bold] %b-%d "
set -g status-right-length 120
