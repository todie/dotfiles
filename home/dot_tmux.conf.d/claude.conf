# ═══════════════════════════════════════════════════════════════
#  Claude Code workflow additions — sourced from ~/.tmux.conf via
#  `if-shell [ -f ~/.tmux.conf.d/claude.conf ]`, AFTER the theme's
#  generated theme.conf, so the directives here are the final word.
# ═══════════════════════════════════════════════════════════════
#
#  Makes multi-session Claude work glanceable, in the slim/airy aesthetic of
#  the themed bar (no powerline capsules). Two facts only:
#
#    • per-window glyph   ● working   ◉ idle / may-need-you   (none if no Claude)
#      colored by context pressure: green <60% · yellow 60–85% · red ≥85%
#      (dim if unknown); % appended only once it matters (≥60%).
#    • status-right aggregate   ◉<waiting> ●<active> ⤒<hottest ctx>%
#
#  HOW (poll-based — no hooks, no settings.json changes): the status bar runs
#  ~/.local/bin/tmux-claude-state in status-right's #(). That one call reads
#  live Claude processes (precise pane→session via each proc's /proc environ),
#  derives context-% from transcripts, and PUSHES a pre-colored glyph into each
#  window's @claude_glyph option. tmux does NOT run #() in window-status-format,
#  so the formats below just embed the pushed #{@claude_glyph}. Colors come from
#  the @t_* palette at push time, so `theme set` recolors within one interval.
#  Absolute path: tmux runs #() without ~/.local/bin on PATH.

# Default context-window size for the ctx-% gauge. tmux #() can't see shell
# exports, so this option is how tmux-claude-state learns the real limit. This
# machine runs Opus 4.8 1M by default; set to 200000 if you mostly run standard
# context (the script falls back to a conservative heuristic when this is 0).
set -g @claude_ctx_limit 1000000

# ── Per-window Claude glyph (pushed into @claude_glyph; space only when set) ─
setw -g window-status-format \
  "#[fg=#{@t_dim}] #I:#W#{?#{@claude_glyph}, #{@claude_glyph},}#{?window_zoomed_flag, ⊕,}#{?window_last_flag, ‹,} "
setw -g window-status-current-format \
  "#[fg=#{@t_cyan},bold] #I:#W#{?#{@claude_glyph}, #{@claude_glyph},}#{?window_zoomed_flag, ⊕,} "

# ── Slim status-right: Claude aggregate (also drives the push) · git · clock ─
# `timeout` caps each helper's lifetime so a single hung/slow run can never spin
# (the flock guard in tmux-claude-state prevents pileup; timeout bounds runaway).
set -g status-right \
  "#(timeout -k 1 5 ~/.local/bin/tmux-claude-state) #[fg=#{@t_dim}]#(timeout -k 1 3 ~/.local/bin/tmux-git-branch '#{pane_current_path}') #[fg=#{@t_pink}]%H:%M "
set -g status-right-length 120
