# ceres: start the one keyring daemon unlocked with the login password from
# 1Password (keyring-daemon-start). See ~/.local/share/keyrings/README-DO-NOT-RESET.md.
# The user instance has no network-online.target; keyring-daemon-start retries
# the 1Password read for about a minute instead.
[Service]
ExecStart=
ExecStart=%h/.local/bin/keyring-daemon-start
