# ═══════════════════════════════════════════════════════════════════════════
#  ~/.tmux.conf — N E O N   D R E A M S
#  zsh + tmux + claude. butter-smooth.
#  Author: Christian M. Todie <chris@todie.io>
# ═══════════════════════════════════════════════════════════════════════════
#
#  Cheatsheet (PREFIX = ` backtick — one key, zero chords):
#
#    SPLITS                          NAVIGATION (vim hjkl)
#      |        horizontal split       h j k l   move pane
#      -        vertical split         H J K L   resize pane (repeat)
#      \        full-width vertical    Alt+←↑↓→  move pane (no prefix)
#      _        full-height horizontal Alt+1..9  jump to window N
#      c        new window             `+`       literal backtick
#      C        new window in $HOME    Tab       toggle to last window
#
#    LAYOUTS (instant agent teams)   POPUPS (no prefix needed)
#      T        3-pane lead+2          C-g       lazygit fullscreen
#      F        4-pane 2x2 grid        C-f       fzf session switcher
#      S        5-pane lead+squad      C-n       new project session
#      v        main-vertical 75/25    C-/       claude-esp tail
#
#    CLAUDE                          UTILITY
#      e        spawn claude-esp side  r         reload config
#      E        run /claude-esp pop    R         rename window
#      o        claude-tmux-layout     a         broadcast on/off
#      C-c      copy mode (vi)         m         mark pane / M jump
#                                      x         kill pane (no prompt)
#                                      X         kill window
#                                      z         zoom toggle (built-in)
#
#    THEME: theme-driven — `theme set <name>` recolors tmux + starship + fzf
#           together. `theme list` shows what's available (default neon-dreams).
#
# ═══════════════════════════════════════════════════════════════════════════

# ── Core ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,wezterm:RGB"
set -ag terminal-features ",xterm-256color:usstyle"
set -g default-shell ${SHELL}
set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g allow-rename off
set -g visual-bell off
set -g bell-action none
set -g aggressive-resize on
set -g display-time 1500
set -g display-panes-time 2000
set -g status-keys vi
setw -g mode-keys vi
setw -g monitor-activity on
setw -g visual-activity off

# ── Claude Code requirement ──────────────────────────────────────────────
# REQUIRED for Claude Code OSC sequences to pass through tmux. Without
# this, Claude Code's image previews, status updates, and a few other
# OSC features silently break inside tmux. See claude-code issue #19976.
set -g allow-passthrough on

# ── Prefix: backtick ──────────────────────────────────────────────────────
unbind C-b
set -g prefix `
bind ` send-prefix
bind Space last-window

# ── Splits — keep current path ────────────────────────────────────────────
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '\' split-window -fh -c "#{pane_current_path}"
bind '_' split-window -fv -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C new-window -c "$HOME"
unbind '"'
unbind %

# ── Vim-style pane navigation ─────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── No-prefix navigation ──────────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-h     select-pane -L
bind -n M-j     select-pane -D
bind -n M-k     select-pane -U
bind -n M-l     select-pane -R

# ── Vim-tmux-navigator (seamless C-hjkl between vim and tmux panes) ──────
# If the focused process is vim/nvim, the keystroke goes to vim. Otherwise
# tmux moves panes. Works without the actual vim-tmux-navigator plugin —
# this is the canonical pattern from christoomey/vim-tmux-navigator's
# tmux side, inlined.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Window jumps without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10
bind -n M-Tab next-window
bind -n M-BTab previous-window

# Pane swap
bind -r '<' swap-window -d -t -1
bind -r '>' swap-window -d -t +1

# ── Reload + display ──────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "▲ neon dreams reloaded"
bind R command-prompt -I "#W" "rename-window '%%'"

# ── Copy mode (vi-style) ──────────────────────────────────────────────────
bind Enter copy-mode
bind C-c copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux-copy"
bind -T copy-mode-vi Y send -X copy-line
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "tmux-copy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi / command-prompt -i -p "search↓" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "search↑" "send -X search-backward-incremental \"%%%\""

# ── Paste ────────────────────────────────────────────────────────────────
bind p paste-buffer
bind P choose-buffer                    # pick from buffer list
bind -n MouseDown3Pane paste-buffer     # right-click paste

# ── Pane marks (vim-style) ────────────────────────────────────────────────
bind m select-pane -m
bind M switch-client -t '{marked}'

# ── Kill — no confirmation ────────────────────────────────────────────────
bind x kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind C-x confirm-before -p "kill session #S? (y/n)" kill-session

# ── Broadcast toggle ──────────────────────────────────────────────────────
bind a setw synchronize-panes \; display "◉ broadcast #{?synchronize-panes,ON,OFF}"

# ═══════════════════════════════════════════════════════════════════════════
#  AGENT TEAMS — instant layouts for multi-pane Claude work
# ═══════════════════════════════════════════════════════════════════════════
#
#  The T/F/S layouts auto-title their panes (lead, worker-N) and turn on the
#  pane border label for that window only, so a multi-agent squad is legible at
#  a glance. The label format is global (harmless when borders are off).
set -g pane-border-format " #{pane_index}#{?pane_title,· #{pane_title},} "

# T — 3-pane: lead left (60%), 2 stacked teammates right
bind T split-window -h -l 40% -c "#{pane_current_path}" \; \
       split-window -v -c "#{pane_current_path}" \; \
       setw pane-border-status top \; \
       select-pane -t 1 -T lead \; \
       select-pane -t 2 -T worker-1 \; \
       select-pane -t 3 -T worker-2 \; \
       select-pane -t 1

# F — 4-pane 2x2 tiled grid
bind F split-window -h -c "#{pane_current_path}" \; \
       split-window -v -c "#{pane_current_path}" \; \
       select-pane -L \; \
       split-window -v -c "#{pane_current_path}" \; \
       select-layout tiled \; \
       setw pane-border-status top \; \
       select-pane -t 1 -T lead \; \
       select-pane -t 2 -T worker-1 \; \
       select-pane -t 3 -T worker-2 \; \
       select-pane -t 4 -T worker-3 \; \
       select-pane -t 1

# S — 5-pane: lead spanning the top (60% height), 4 teammates across the bottom.
# Uses the built-in main-horizontal layout (main pane on top, rest equal below) —
# reliable where tiled+resize produced uneven panes.
bind S split-window -v -c "#{pane_current_path}" \; \
       split-window -h -c "#{pane_current_path}" \; \
       split-window -h -c "#{pane_current_path}" \; \
       split-window -h -c "#{pane_current_path}" \; \
       setw main-pane-height 60% \; \
       select-layout main-horizontal \; \
       setw pane-border-status top \; \
       select-pane -t 1 -T lead \; \
       select-pane -t 2 -T worker-1 \; \
       select-pane -t 3 -T worker-2 \; \
       select-pane -t 4 -T worker-3 \; \
       select-pane -t 5 -T worker-4 \; \
       select-pane -t 1

# v — main-vertical 75/25 (one big pane left, esp/log right)
# (moved off M — M is the marked-pane jump, see "Pane marks" below)
bind v split-window -h -l 25% -c "#{pane_current_path}" \; \
       select-pane -L

# ═══════════════════════════════════════════════════════════════════════════
#  CLAUDE CODE INTEGRATION
# ═══════════════════════════════════════════════════════════════════════════

# e — spawn claude-esp in a side pane (25% width, right)
bind e split-window -h -l 25% -c "#{pane_current_path}" "claude-esp" \; \
       select-pane -L

# E — claude-esp in a popup (overlay, no pane permanent)
bind E display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "claude-esp"

# o — claude-tmux-layout helper (project + esp side pane)
# (moved off L — L is vim-style "resize pane right", see pane navigation above)
bind o run-shell "claude-tmux-layout"

# w — jump to whichever Claude session needs you (a ◉ waiting window, per the
# glance), cross-session safe. W keeps the tree picker that prefix-w used to be.
bind w run-shell "tmux-claude-jump"
bind W choose-tree -Zw

# ═══════════════════════════════════════════════════════════════════════════
#  POPUPS — overlay tools, no prefix where safe
# ═══════════════════════════════════════════════════════════════════════════

# C-g — lazygit fullscreen popup
bind -n C-g if-shell "command -v lazygit >/dev/null 2>&1" \
  "display-popup -E -w 95% -h 95% -d '#{pane_current_path}' lazygit" \
  "display-popup -E -w 80% -h 60% -d '#{pane_current_path}' 'git status; echo; echo press q to close; read'"

# C-f — fzf session switcher popup
bind -n C-f display-popup -E -w 60% -h 50% "tmux-sessionizer || tmux-fzf-session"

# C-n — new project session prompt
bind -n C-n command-prompt -p "new session name:" "new-session -d -s '%%' -c '#{pane_current_path}'; switch-client -t '%%'"

# C-/ — claude-esp popup tail (uses C-/ which most terminals send as C-_)
bind -n 'C-_' display-popup -E -w 90% -h 80% "claude-esp"

# Quick git status + branch popup
bind g display-popup -E -w 80% -h 60% -d "#{pane_current_path}" "git status; echo; git log --oneline -10; echo; read -p 'q to close'"

# ═══════════════════════════════════════════════════════════════════════════
#  STATUS BAR — theme-driven
# ═══════════════════════════════════════════════════════════════════════════
#
#  All colors come from the active theme. `theme set <name>` (starship/scripts/
#  theme) reads starship/themes/<name>.toml and regenerates ~/.config/tmux/
#  theme.conf, which this file sources below. The same palette also drives
#  starship + fzf, so switch once and the whole environment matches.
#  `theme list` shows available palettes; `theme next` cycles.
#
# ── Position + structure (color-free; palette is theme-driven) ─────────────
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 140
setw -g window-status-separator ""
set -g clock-mode-style 24

# ── Colors + status-bar content — generated by `theme set <name>` ──────────
# All palette-dependent directives (status-style, status-left/right, window
# formats, pane borders, message/mode/clock colors) live in this fragment,
# regenerated from starship/themes/<name>.toml on every `theme set`. The same
# palette drives starship + fzf, so the whole environment matches. The guard
# keeps a fresh checkout (before the first `theme set`) from erroring.
if-shell "[ -f ~/.config/tmux/theme.conf ]" "source-file ~/.config/tmux/theme.conf"

# ── Optional: source machine-local overrides ─────────────────────────────
if-shell "[ -f ~/.tmux.local.conf ]" "source-file ~/.tmux.local.conf"
if-shell "[ -f ~/.tmux.conf.d/claude.conf ]" "source-file ~/.tmux.conf.d/claude.conf"

# ─── WSL host clipboard passthrough ─────────────────────────────────────────
# Alt-v  : paste Windows host clipboard into the active pane
# prefix-V : same, with prefix
bind -n M-v run-shell "~/.local/bin/wsl-paste"
bind   V   run-shell "~/.local/bin/wsl-paste"

# (reload is bound once, up in the "Reload + display" section — prefix r)

# ═══════════════════════════════════════════════════════════════════════════
#  END
# ═══════════════════════════════════════════════════════════════════════════
