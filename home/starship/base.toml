# ═══════════════════════════════════════════════════════════════════════════
#  ~/.config/starship.toml — A I R Y
#
#  Minimalist, contextual prompt. No solid powerline blocks — foreground color
#  on the bare terminal background. Two lines: context on the first (path + git
#  left, language/duration/time right-aligned via $fill), a clean `❯` on the
#  second. Modules load only when they're relevant.
#
#  Theme is composable — see ~/projects/dotfiles/starship/themes/ for variants
#  and `theme list` / `theme set <name>` to switch. The base file (this one)
#  defines the LAYOUT — what segments appear and how. Theme files override
#  COLORS only: every palette defines the same semantic keys (neon_pink,
#  neon_cyan, …) used here as foreground colors.
#
#  Author: Christian M. Todie <chris@todie.io>
# ═══════════════════════════════════════════════════════════════════════════

"$schema" = 'https://starship.rs/config-schema.json'

# Root-level config — MUST precede any [section] header. Theme files are
# concatenated AFTER this file (their [palettes.neon_dreams] block stays
# isolated from these root keys).
add_newline = true
command_timeout = 500
scan_timeout = 30
palette = "neon_dreams"

# ── Format — airy two-line, context right-aligned ─────────────────────────
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$rust\
$nodejs\
$python\
$golang\
$lua\
$nix_shell\
$docker_context\
$kubernetes\
$aws\
$cmd_duration\
${custom.claude_code}\
$time\
$line_break\
$jobs\
$status\
$character"""

[fill]
symbol = " "
style = "fg:neon_dim"

# ── Identity — contextual: only over SSH / as root ────────────────────────
[username]
show_always = false
style_user = "fg:neon_green"
style_root = "fg:neon_red bold"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "fg:neon_purple"
format = "[@$hostname]($style) "

[os]
disabled = true

# ── Directory ─────────────────────────────────────────────────────────────
[directory]
style = "bold fg:neon_cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "fg:neon_yellow"

[directory.substitutions]
"projects" = " "
".config" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# ── Git ───────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "fg:neon_purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:neon_yellow"
format = "([$all_status$ahead_behind]($style)) "
conflicted = " "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = ""
stashed = ""
modified = ""
staged = '[++\($count\)](fg:neon_green)'
renamed = "󰟕"
deleted = ""

# ── Languages — contextual (only with relevant files), subtle green ───────
[rust]
symbol = " "
style = "fg:neon_green"
format = "[$symbol($version)]($style) "

[nodejs]
symbol = " "
style = "fg:neon_green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "fg:neon_green"
format = "[$symbol($version)(\\($virtualenv\\))]($style) "

[golang]
symbol = " "
style = "fg:neon_green"
format = "[$symbol($version)]($style) "

[lua]
symbol = " "
style = "fg:neon_green"
format = "[$symbol($version)]($style) "

[nix_shell]
symbol = " "
style = "fg:neon_green"
format = "[$symbol$state(\\($name\\))]($style) "

# ── Cloud / container context — only show when relevant ───────────────────
[docker_context]
symbol = " "
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile", "compose.yaml", "compose.yml"]
style = "fg:neon_cyan"
format = "[$symbol$context]($style) "

[kubernetes]
disabled = false
# No detect_* gating — show the active context+namespace in any directory
# whenever a kubeconfig context is set (kubectl/helm/k9s are daily drivers).
style = "fg:neon_cyan"
format = "[󱃾 $context( \\($namespace\\))]($style) "
contexts = [
  { context_pattern = "prod.*", style = "fg:neon_red bold" },
  { context_pattern = "stag.*", style = "fg:neon_yellow" },
]

[aws]
disabled = false
symbol = "󰸏 "
style = "fg:neon_cyan"
format = "[$symbol($profile )(\\($region\\))]($style) "

# ── Cmd duration — only if > 2s ───────────────────────────────────────────
[cmd_duration]
min_time = 2_000
style = "fg:neon_yellow"
format = "[󰔚 $duration]($style) "

# ── Claude Code session indicator — only inside a Claude Code session ─────
# [custom] module: shows a glyph only when $CLAUDECODE is set (Claude Code
# exports it in every shell it spawns). Renders nothing in a normal terminal.
[custom.claude_code]
description = "Shown when inside a Claude Code session"
when = 'test -n "$CLAUDECODE"'
symbol = "󰚩 "
format = "[$symbol]($style)"
style = "fg:neon_cyan"

# ── Time — right-aligned ──────────────────────────────────────────────────
[time]
disabled = false
use_12hr = false
time_format = "%H:%M"
style = "fg:neon_dim"
format = "[󰥔 $time]($style)"

# ── Background jobs ───────────────────────────────────────────────────────
[jobs]
symbol = ""
style = "fg:neon_yellow bold"
format = "[$symbol$number]($style) "
number_threshold = 1

# ── Exit status — before the prompt char on non-zero ──────────────────────
[status]
disabled = false
symbol = " "
success_symbol = ""
not_executable_symbol = "󰂭 "
not_found_symbol = "󰼶 "
sigint_symbol = "󰻹 "
signal_symbol = "󱐋 "
style = "fg:neon_red bold"
format = "[$symbol$status]($style) "
map_symbol = true
recognize_signal_code = true

# ── Character — the prompt cursor (plain ❯, renders in any font) ──────────
[character]
success_symbol = "[❯](bold fg:neon_pink)"
error_symbol   = "[❯](bold fg:neon_red)"
vimcmd_symbol  = "[❮](bold fg:neon_yellow)"
vimcmd_replace_one_symbol = "[❮](bold fg:neon_purple)"
vimcmd_replace_symbol = "[❮](bold fg:neon_purple)"
vimcmd_visual_symbol = "[❮](bold fg:neon_cyan)"

# ── Disabled ──────────────────────────────────────────────────────────────
[battery]
disabled = true

# ═══════════════════════════════════════════════════════════════════════════
#  THEME OVERRIDE — palette block appended below by `theme set <name>`
#  (the theme.tmpl helper concatenates base.toml + themes/<name>.toml into
#  ~/.config/starship.toml). Default palette is synthwave-84 / neon dreams.
# ═══════════════════════════════════════════════════════════════════════════
